version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"
  - package-ecosystem: "gomod"
    directory: "/"
    cooldown: 7d
      default-days: 7
    schedule:
      interval: "monthly"
